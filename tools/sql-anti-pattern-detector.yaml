name: sql-anti-pattern-detector
version: 1.0.0
description: "Scans SQL text for SELECT *, leading wildcards, and unindexed conversions"
input_schema:
  type: object
  properties:
    sql_query:
      type: string
      description: "SQL statement string"
  required:
    - sql_query
implementation:
  type: script
  path: sql_anti_pattern_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
