name: query-cost-analyzer
version: 1.0.0
description: "Parses execution plan total cost and validates against organizational SLA threshold"
input_schema:
  type: object
  properties:
    plan_json:
      type: string
      description: "JSON representation of database EXPLAIN plan"
  required:
    - plan_json
implementation:
  type: script
  path: query_cost_analyzer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
