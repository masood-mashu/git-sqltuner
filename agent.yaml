spec_version: "0.1.0"
name: git-sqltuner
version: 1.0.0
description: "Autonomous SQL Query Plan Optimizer, Missing Index Advisor & Anti-Pattern Sentry"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - query-plan-analysis
  - relational-index-tuning

tools:
  - query-cost-analyzer
  - missing-index-advisor
  - sql-anti-pattern-detector

runtime:
  max_turns: 50
  timeout: 120

tags:
  - data-analytics
  - sql-tuning
  - query-optimization
  - database-indexing
  - passport-challenge

metadata:
  passport_id: "aps-sqltuner-01"
  passport_category: "Data & analytics"
